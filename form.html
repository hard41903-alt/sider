<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма - Лабораторная №2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>
    <header class="header bg-dark text-white py-3">... (header выше)</header>
    
    <main class="container py-5">
        <h1 class="display-4 text-center mb-4">Форма заказа</h1>
        <form class="bg-light p-4 rounded">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" class="form-control" placeholder="Иван Иванов">
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" class="form-control" placeholder="+7 (999) 123-45-67">
            </div>
            <div class="form-group">
                <label>Сообщение</label>
                <textarea class="form-control" rows="5"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Отправить</button>
        </form>
    </main>
    
    <footer class="footer bg-dark text-white py-5">... (footer выше)</footer>
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
